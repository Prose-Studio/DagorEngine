name: template

# Creates a project from templates/dng-empty with dng.py new outside the engine checkout (on Windows on another
# drive, which needs an absolute engine path and jam Location), builds its game and runs its tests that need no GPU.
# See _docs/source/getting-started/new_project.md. The jam build (new-project) runs next to the CMake one
# (new-project-cmake: the client and the dedicated server with daScript AOT, the tests on CTest) until jam is deleted.

on:
  push:
    branches: [ "main" ]
    paths: [ "templates/**", "dng.py", "prog/tools/pythonCommon/**", "prog/setup_package.py",
             "prog/_jBuild/**", "prog/cmake/**", "prog/daNetGame/**", "prog/daNetGameLibs/**",
             ".github/workflows/template.yaml" ]
  schedule:
    - cron: '0 3 * * 1' # weekly: engine changes outside the paths above can break the template too
  workflow_dispatch:

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAGOR_NONINTERACTIVE: '1'

jobs:
  new-project:
    name: new project (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            devtools: D:/devtools
          - os: ubuntu-22.04
            devtools: /home/runner/devtools
          - os: macos-15 # Xcode 16: the Metal driver needs the macOS 15 SDK (MTLResidencySet)
            devtools: /Users/runner/devtools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360 # three trees (client, dedicated, daScript AOT compiler) without a compiler cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache devtools
        uses: actions/cache@v4
        with:
          path: ${{ matrix.devtools }}/.packages # downloads only: the rest links to software of the runner machine (Visual Studio, SDKs, Xcode)
          key: devtools-packages-${{ matrix.os }}-${{ hashFiles('prog/tools/pythonCommon/dagorDevtools/**') }}

      - name: Set up devtools
        shell: bash
        run: |
          python dng.py devtools "${{ matrix.devtools }}"
          echo "GDEVTOOL=${{ matrix.devtools }}" >> "$GITHUB_ENV"
          echo "${{ matrix.devtools }}" >> "$GITHUB_PATH"

      - name: Choose the project dir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # another drive than the engine: engine.blk and the jam Location become absolute
            mkdir -p "$RUNNER_TEMP/xdrive"
            cmd //c subst X: "$(cygpath -w "$RUNNER_TEMP/xdrive")"
            echo "PROJECT_DIR=X:/CiGame" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/../CiGame" >> "$GITHUB_ENV"
          fi

      - name: Create the project
        shell: bash
        run: python dng.py new --name CiGame --dest "$PROJECT_DIR"

      - name: Build the game
        shell: bash
        run: python "$PROJECT_DIR/project.py" build code --jam

      - name: Run the tests
        shell: bash
        run: |
          python "$PROJECT_DIR/project.py" test --jam --layer cpp,das,ecs --gpu no --out _output/test_results/ci \
            --junit test-results.xml --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-report-${{ matrix.os }}
          path: |
            _output/test_results/ci
            test-results.xml
          if-no-files-found: ignore

  new-project-cmake:
    name: new project, CMake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            deps: D:/dagor-deps
          - os: ubuntu-22.04
            deps: /home/runner/dagor-deps
          - os: macos-15 # Xcode 16: the Metal driver needs the macOS 15 SDK (MTLResidencySet)
            deps: /Users/runner/dagor-deps
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      DAGOR_DEPS_DIR: ${{ matrix.deps }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake and Ninja
        run: python -m pip install "cmake>=4.0,<5" "ninja>=1.11"

      - name: Install the system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libfltk1.3-dev \
            libxkbfile-dev libudev-dev libpulse-dev uuid-dev nasm

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: ${{ matrix.deps }}/sdk
          key: dagor-deps-${{ matrix.os }}-${{ hashFiles('prog/cmake/sdk/manifest.cmake') }}

      - name: Choose the project dir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # another drive than the engine: engine.blk becomes absolute
            mkdir -p "$RUNNER_TEMP/xdrive"
            cmd //c subst X: "$(cygpath -w "$RUNNER_TEMP/xdrive")"
            echo "PROJECT_DIR=X:/CiGame" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/../CiGame" >> "$GITHUB_ENV"
          fi

      - name: Create the project
        shell: bash
        run: python dng.py new --name CiGame --dest "$PROJECT_DIR"

      - name: Build the game
        shell: bash
        run: |
          # a build that hangs leaves the processes it was running after 150 minutes (shown by the last step)
          ( sleep 9000
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-String -Width 400"
            else
              ps auxww
            fi ) > "$RUNNER_TEMP/processes.txt" 2>&1 &
          watchdog=$!
          python "$PROJECT_DIR/project.py" build code 2>&1 | tee "$RUNNER_TEMP/build.log" && status=0 || status=$?
          kill $watchdog 2>/dev/null || true
          exit $status

      - name: Run the tests
        shell: bash
        run: python "$PROJECT_DIR/project.py" test --ci --output-junit "$GITHUB_WORKSPACE/test-results.xml"

      - name: Processes of a hung build
        if: always()
        shell: bash
        run: if [ -s "$RUNNER_TEMP/processes.txt" ]; then cat "$RUNNER_TEMP/processes.txt"; fi

      - name: Collect crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/crashes"
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$dir" -type f \( -name '*.ips' -o -name '*.crash' \) -mmin -360 -exec cp {} "$RUNNER_TEMP/crashes/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/crashes"
          for f in "$RUNNER_TEMP/crashes"/*; do [ -f "$f" ] && head -c 20000 "$f"; done || true

      - name: Backtrace of a crashed build step (macOS)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          # the command of the first step that died of a signal (ninja: FAILED: [code=13x], then "cd <dir> && <command>"),
          # run again in lldb
          cmd=$(awk '/^FAILED: \[code=1(3[0-9]|4[0-9])\]/ {getline; print; exit}' "$RUNNER_TEMP/build.log")
          if [ -n "$cmd" ]; then
            echo "$cmd"
            dir=${cmd#cd }; dir=${dir%% && *}
            run=${cmd#* && }
            cd "$dir" && eval "lldb --batch -o run -k 'thread backtrace all' -k quit -- $run" || true
          fi

      - name: Upload crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: template-cmake-crashes-${{ matrix.os }}
          path: ${{ runner.temp }}/crashes
          if-no-files-found: ignore

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-cmake-report-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore
