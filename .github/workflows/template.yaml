name: template

# Creates a project from each template with dng.py new outside the engine checkout (on Windows on another drive, which
# makes its engine path absolute), then runs its workflow presets: <host> (everything: the game, its content, a
# multiplayer game's dedicated server, the engine tools they need), <host>-test (the tests that need no GPU) and the
# packages, which verify_game_packages.py inspects and runs the ECS tests in. See _docs/source/getting-started/new_project.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAGOR_NONINTERACTIVE: '1'

jobs:
  new-project:
    name: ${{ matrix.template }} (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        template: [sp-3d, mp-3d, sp-2d, mp-2d]
        host: [windows, linux, macos]
        include:
          - { host: windows, os: windows-2022, deps: 'D:/dagor-deps' }
          - { host: linux, os: ubuntu-22.04, deps: /home/runner/dagor-deps }
          - { host: macos, os: macos-15, deps: /Users/runner/dagor-deps } # Xcode 16: Metal needs the macOS 15 SDK
          - { template: mp-3d, multiplayer: true }
          - { template: mp-2d, multiplayer: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360 # the game, its AOT compiler, the engine's tools and the content
    env:
      DAGOR_DEPS_DIR: ${{ matrix.deps }}
      DAGOR_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: ${{ matrix.deps }}/compiler-cache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: template-${{ matrix.host }}

      - name: Choose the project dir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # another drive than the engine: application.blk and the presets name it by an absolute path
            mkdir -p "$RUNNER_TEMP/xdrive"
            cmd //c subst X: "$(cygpath -w "$RUNNER_TEMP/xdrive")"
            echo "PROJECT_DIR=X:/CiGame" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$(dirname "$GITHUB_WORKSPACE")/CiGame" >> "$GITHUB_ENV" # no .. (the artifact paths)
          fi

      - name: Create the project
        shell: bash
        run: python dng.py new --template ${{ matrix.template }} --name CiGame --dest "$PROJECT_DIR"

      - name: Build everything
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/prog
        run: cmake --workflow --preset ${{ matrix.host }}

      - name: Test
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/prog
        run: cmake --workflow --preset ${{ matrix.host }}-test

      - name: Package and verify the game
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/prog
        run: |
          cmake --workflow --preset ${{ matrix.host }}-client-package
          if [ "${{ matrix.multiplayer }}" = true ]; then
            cmake --workflow --preset ${{ matrix.host }}-dedicated-package
          fi
          python "$GITHUB_WORKSPACE/prog/cmake/scripts/verify_game_packages.py" "$PROJECT_DIR"

      - name: Compiler cache statistics
        if: always()
        run: cmake -DSTATS=ON -P prog/cmake/scripts/compiler_cache.cmake

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-${{ matrix.template }}-${{ matrix.host }}
          path: |
            ${{ env.PROJECT_DIR }}/build/*/test-artifacts
            ${{ env.PROJECT_DIR }}/build/package-checks
          if-no-files-found: ignore
