name: cmake

# The engine's trees, each one a workflow preset of prog/CMakePresets.json (cmake --workflow --preset <name>):
# configure, build and, for the tests trees, the tests hosted runners can run (-ci: no GPU, no display). The Visual
# Studio and Xcode generators also configure the tests tree and build one test program; dargbox is also cross-built
# for Android (its APK) and iOS (its app bundle).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trees:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        preset: [tests-ci, msvc-tests-ci, cdk, assets, editor, dargbox]
        host: [windows, linux, macos]
        exclude:
          - { host: linux, preset: msvc-tests-ci }
          - { host: macos, preset: msvc-tests-ci }
        include:
          - { host: windows, os: windows-2022, deps: 'D:/dagor-deps' }
          - { host: linux, os: ubuntu-22.04, deps: /home/runner/dagor-deps }
          - { host: macos, os: macos-15, deps: /Users/runner/dagor-deps } # Xcode 16: Metal needs the macOS 15 SDK
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DAGOR_DEPS_DIR: ${{ matrix.deps }}
      DAGOR_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: ${{ matrix.deps }}/compiler-cache
      SCCACHE_CACHE_SIZE: 1G
      PRESET: ${{ matrix.host }}-${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.host }}-${{ matrix.preset }}

      - name: Configure, build and test
        working-directory: prog
        run: cmake --workflow --preset ${{ env.PRESET }}

      - name: Compiler cache statistics
        if: always()
        run: cmake -DSTATS=ON -P prog/cmake/scripts/compiler_cache.cmake

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ env.PRESET }}
          path: build/*/test-artifacts
          if-no-files-found: ignore

  mobile:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: android-dargbox, os: ubuntu-22.04, deps: /home/runner/dagor-deps, app: tools/dargbox/android/*.apk }
          - { preset: ios-dargbox, os: macos-15, deps: /Users/runner/dagor-deps, app: tools/dargbox/iOS/*.app }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      DAGOR_DEPS_DIR: ${{ matrix.deps }}
      DAGOR_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: ${{ matrix.deps }}/compiler-cache
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.preset }}

      - name: Set up the JDK (the APK's Java code and the SDK's build tools)
        if: startsWith(matrix.preset, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure and build
        working-directory: prog
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: ${{ matrix.app }}

  ide-generators:
    name: ide generator (${{ matrix.generator }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-msvc-tests, generator: Visual Studio 17 2022, deps: 'D:/dagor-deps' }
          - { os: macos-15, preset: macos-tests, generator: Xcode, deps: /Users/runner/dagor-deps }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DAGOR_DEPS_DIR: ${{ matrix.deps }}
      DAGOR_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: ${{ matrix.deps }}/compiler-cache
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          cache-key: ide-${{ matrix.preset }}

      - name: Configure and build datablock-tests
        working-directory: prog
        run: |
          cmake --preset ${{ matrix.preset }} -G "${{ matrix.generator }}" -B ../build/ide-${{ matrix.preset }}
          cmake --build ../build/ide-${{ matrix.preset }} --config Dev --target datablock-tests
